[project]
name = "rolepointer"
version = "0.1.0"
description = "Autonomous Job Discovery, Guardrail Triage & Tailored Career Pipeline built with Strands SDK and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "reportlab>=4.1.0",
    "loguru>=0.7.2",
    "boto3>=1.34.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langsmith>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rolepointer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
